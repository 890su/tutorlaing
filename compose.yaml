services:
  tutorlaing:
    image: ghcr.io/890su/tutorlaing:latest
    container_name: tutorlaing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_WEBHOOK_URL: https://brain.sekond.pl/telegram/webhook
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
    secrets:
      - telegram_webhook_secret
    volumes:
      - tutorlaing-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5678:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  tutorlaing-data:

secrets:
  telegram_webhook_secret:
    file: ./.telegram_webhook_secret
